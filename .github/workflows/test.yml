name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.partition }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.partition == 'B' && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        partition: [A1, A2, A3, B]
    env:
      CI_TEST_PARTITION: ${{ matrix.partition }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Record source and runtime; reject local configuration
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path, PurePosixPath
          if any(path.name != ".env.example" for path in Path.cwd().glob(".env*")):
              raise SystemExit("Local environment configuration must not enter CI")
          output = Path("artifacts/ci")
          output.mkdir(parents=True, exist_ok=True)
          context = {
              "schema": "aria_ci_context_v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ["RUNNER_OS"],
              "python": platform.python_version(),
              "partition": os.environ["CI_TEST_PARTITION"],
              "evidence_kind": "software_and_clean_package_install",
              "model_effect_claim": False,
          }
          def git(*arguments):
              return subprocess.run(["git", *arguments], capture_output=True, check=False)
          autocrlf = git("config", "--get", "core.autocrlf")
          context["checkout"] = {
              "head_commit": git("rev-parse", "HEAD").stdout.decode().strip(),
              "core_autocrlf": autocrlf.stdout.decode().strip() if autocrlf.returncode == 0 else None,
              "manifest_present": Path("RELEASE_MANIFEST.json").is_file(),
              "diagnostic_only": True,
          }
          if context["checkout"]["manifest_present"]:
              raw = Path("RELEASE_MANIFEST.json").read_bytes()
              manifest = json.loads(raw)
              mismatches = []
              for row in manifest["files"]:
                  name = PurePosixPath(row["path"])
                  if (name.is_absolute() or ".." in name.parts or "\\" in str(name)
                      or ":" in str(name) or ".git" in name.parts
                      or any(part.startswith(".env") and part != ".env.example" for part in name.parts)):
                      raise SystemExit("Unsafe source manifest path")
                  path = Path(name)
                  data = path.read_bytes() if path.is_file() and not path.is_symlink() else None
                  actual = hashlib.sha256(data).hexdigest() if data is not None else None
                  if actual == row["sha256"]:
                      continue
                  blob = git("show", "HEAD:" + name.as_posix())
                  original = blob.stdout if blob.returncode == 0 else None
                  mismatches.append({
                      "path": name.as_posix(), "expected_sha256": row["sha256"],
                      "checkout_sha256": actual,
                      "git_blob_matches_manifest": original is not None and hashlib.sha256(original).hexdigest() == row["sha256"],
                      "newline_only_vs_git_blob": data is not None and original is not None and data.replace(b"\r\n", b"\n") == original.replace(b"\r\n", b"\n"),
                  })
              context["checkout"].update({
                  "manifest_sha256": hashlib.sha256(raw).hexdigest(),
                  "manifest_policy": manifest["policy_version"],
                  "manifest_source_files": len(manifest["files"]),
                  "checkout_byte_mismatches": mismatches,
              })
          (output / "context.json").write_text(json.dumps(context, indent=2) + "\n", encoding="utf-8")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,secure]" build twine
      - name: Record resolved dependencies
        run: python -m pip list --format=json > artifacts/ci/dependencies.json
      - run: python -m ruff check aria examples scripts tests
      - run: python scripts/ci_tests.py run --partition "${{ matrix.partition }}"
      - run: python -m pip check
      - run: python -m build
        if: matrix.partition == 'B'
      - name: Verify wheel and sdist in separate clean environments
        if: matrix.partition == 'B'
        run: python scripts/check_release_install.py --dist-dir dist --work-dir artifacts/ci/install
      - name: Check curated source policy
        run: python scripts/build_minimal_release.py --check
      - name: Retain this matrix cell's software evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-${{ matrix.os }}-python-${{ matrix.python-version }}-${{ matrix.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/context.json
            artifacts/ci/dependencies.json
            artifacts/ci/pytest.xml
            artifacts/ci/collection.json
            artifacts/ci/execution.json
            artifacts/ci/install/result.json
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Four platform software summary
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: software-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/downloaded
      - name: Verify complete and non-overlapping coverage for all four platforms
        run: python scripts/ci_tests.py summary --directory artifacts/downloaded --output artifacts/summary/four-platforms.json --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: four-platform-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/summary/four-platforms.json
          if-no-files-found: warn
          retention-days: 14
