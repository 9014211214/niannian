name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Record source and runtime; reject local configuration
        run: |
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          if any(path.name != ".env.example" for path in Path.cwd().glob(".env*")):
              raise SystemExit("Local environment configuration must not enter CI")
          output = Path("artifacts/ci")
          output.mkdir(parents=True, exist_ok=True)
          context = {
              "schema": "aria_ci_context_v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner_os": os.environ["RUNNER_OS"],
              "python": platform.python_version(),
              "evidence_kind": "software_and_clean_package_install",
              "model_effect_claim": False,
          }
          (output / "context.json").write_text(json.dumps(context, indent=2) + "\n", encoding="utf-8")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,secure]" build twine
      - name: Record resolved dependencies
        run: python -m pip list --format=json > artifacts/ci/dependencies.json
      - run: python -m ruff check aria examples scripts tests
      - run: python -m pytest -q -ra --junitxml=artifacts/ci/pytest.xml
      - run: python -m pip check
      - run: python -m build
      - name: Verify wheel and sdist in separate clean environments
        run: python scripts/check_release_install.py --dist-dir dist --work-dir artifacts/ci/install
      - name: Check curated source policy
        run: python scripts/build_minimal_release.py --check
      - name: Retain this matrix cell's software evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-${{ matrix.os }}-python-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/context.json
            artifacts/ci/dependencies.json
            artifacts/ci/pytest.xml
            artifacts/ci/install/result.json
          if-no-files-found: warn
          retention-days: 14
