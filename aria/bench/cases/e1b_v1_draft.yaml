  - [中午我自己做了个土豆丝，切得粗了。, 平]
  - [能吃就行。, 平]
  - [下午在家看了会儿报纸。, 平]
  - [女儿说周末回来吃饭。, 喜]
  - [我想给她做个红烧肉。, 喜]
  - [她小时候最爱吃她妈做的。, 低]
