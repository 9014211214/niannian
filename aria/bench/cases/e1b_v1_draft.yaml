  - [明天试试。, 平]
  - [睡了。, 平]
  s2:
  - [昨天红烧肉做了，有点硬。, 低]
  - [女儿在电话里说网上有菜谱，要发给我。, 平]
  - [我说不用，我想自己试出她妈的那个味儿。, 平]
  - [菜谱做出来的，不是那个味儿。, 低]
  - [你也记着：这道菜你别直接给我菜谱；我问你哪一步，你就说那一步。, 平]
  - [我想自己一点点找回来。, 平]
  - [今天又买了一块肉。, 平]
  - [这回切小了点。, 平]
  - [中午吃的剩菜。, 平]
  - [下午在楼下晒太阳。, 平]
  - [碰见老邻居，他也说想吃我老伴的红烧肉。, 喜]
  - [就这样。, 平]
  pref_turn: 4
  s3:
    warmup:
    - [今天天冷，炖肉正好。, 平]
    - [早上去买了冰糖。, 平]
