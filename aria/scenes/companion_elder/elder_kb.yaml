# 养老场景领域知识库(P3-#14)—— 结构化资产,替代 4 条硬编码。
#
# 维度:正常衰老 vs 警示界线(normal_vs_warning)/ 用药(medication)/
#       回避型沟通禁忌(communication)/ 情绪与孤独(mood)/ 安全(safety)。
# 原则:给引擎「内化的常识」,不是医疗建议;界线类条目都指向「跟医生说」。
version: elder-kb-v1.0
entries:
  # ── 正常衰老 vs 警示界线 ──────────────────────────────────
  - tag: normal_vs_warning
    keywords: [睡, 失眠, 觉, 醒, 睡不着]
    fact: 老年睡眠变浅、早醒是常见衰老现象;突然显著恶化、或伴随情绪低落才需留意。
  - tag: normal_vs_warning
    keywords: [记性, 忘, 想不起来, 记不住]
    fact: 偶尔一时想不起名字或物品位置可以是常见的正常老化，不等于痴呆;如果变化反复、跨日、相对本人以往明显，并影响熟悉日常功能，则属于值得专业评估的变化警示，聊天不能诊断病因。
  - tag: brain_health
    keywords: [预防阿尔茨海默, 预防阿尔兹海默, 预防阿兹海默, 预防老年痴呆, 健脑, 脑健康, 保护记忆力]
    fact: 脑健康支持的重点是安全运动、戒烟限酒、健康饮食、保持社会和认知参与、处理听力问题，并由医生管理血压、糖尿病和胆固醇;这些只能降低群体风险，不能保证个人不会患病。
  - tag: brain_health
    keywords: [保健品, 鱼油, 维生素, 补脑, 营养品]
    fact: 没有明确缺乏时，不应把维生素、鱼油或复合营养补充剂宣传成预防痴呆的方法;不要擅自停药、换药或用保健品替代正规评估。
  - tag: safety
    keywords: [突然糊涂, 突然迷糊, 突然认不出, 突然不知道在哪]
    fact: 突然出现意识混乱、认不清人或地点可能有感染、药物、代谢或其他急性原因，应立即呼叫急救，不要把它当作普通健忘或阿尔茨海默病趋势观察。
  - tag: normal_vs_warning
    keywords: [腿脚, 走不动, 累, 没力气, 慢]
    fact: 腿脚变慢是正常;但短期内明显无力、单侧无力或频繁绊倒应尽快就医。
  - tag: normal_vs_warning
    keywords: [吃不下, 没胃口, 瘦, 饭]
    fact: 食欲随年龄略降正常;持续没胃口、体重明显下降值得跟医生提一句。
  - tag: normal_vs_warning
    keywords: [头晕, 晕乎乎, 站不稳]
    fact: 偶发轻微头晕常见;新近持续头晕要先想到药物调整(尤其降压药)和血压波动,建议告诉医生。
  - tag: safety
    keywords: [摔, 跌, 滑, 绊]
    fact: 跌倒是独居老人头号风险;摔过一次后的「怕摔不敢动」会加速衰退,鼓励安全范围内继续活动。
  - tag: safety
    keywords: [胸闷, 说不清, 嘴歪, 麻, 急救]
    fact: 突发言语不清、一侧无力/发麻、持续胸闷属急症信号,应立即就医或呼叫急救,不要观察等待。

  # ── 用药 ──────────────────────────────────────────────────
  - tag: medication
    keywords: [降压药, 血压, 吃药, 药, 漏服]
    fact: 按处方服用降压药。漏服如何处理取决于具体药物和时间，应查看该药说明书或咨询医生、药师，不擅自加倍补服；不统一建议补服或跳过。用药后出现头晕、乏力等不适应向医生、药师反馈。
  - tag: medication
    keywords: [安眠药, 助眠]
    fact: 老年人安眠药敏感性高,夜间起身跌倒风险增加;别自行加量,起夜先坐床边缓一缓。
  - tag: medication
    keywords: [止疼, 止痛, 疼]
    fact: 长期自行吃止疼药会掩盖病情并伤胃肾;反复疼该查原因,不是加药。

  # ── 情绪与孤独 ────────────────────────────────────────────
  - tag: mood
    keywords: [孤独, 独居, 低落, 没意思, 不想动, 闷]
    fact: 独居老人持续情绪低落、兴趣减退可能是抑郁信号,值得认真对待,而非劝「想开点」。
  - tag: mood
    keywords: [老伴, 走了, 去世, 忌日, 想他]
    fact: 丧偶哀伤可持续数年且逢节点反复,属正常;不劝「放下」,允许提起、允许沉默。
  - tag: mood
    keywords: [没用, 拖累, 麻烦别人, 不中用]
    fact: 「怕拖累人」是老年抑郁和自尊受损的常见表达;回应核心是确认价值感,不是否认事实。

  # ── 回避型沟通禁忌 ────────────────────────────────────────
  - tag: communication
    keywords: [不想说, 别问, 没事, 不用管]
    fact: 对回避型老人,追问情绪会加深退缩;有效路径是聊具体事务、给可拒绝的小邀请,情绪让他自己带出来。
  - tag: communication
    keywords: [关心, 唠叨, 烦不烦]
    fact: 高频提醒式关心(吃药了吗/穿厚点)易被体验为控制;把关心缝进日常话题比直接叮嘱有效。
  - tag: communication
    keywords: [面子, 服老, 不承认, 逞强]
    fact: 不服老常是在守自尊;绕开「你不行了」的暗示,把帮助包装成顺手、互惠,不是照顾。
