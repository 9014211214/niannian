    - 女儿上周来过电话,他那次没接
    - 楼下那只大橘猫这几天又来蹭饭
  relationship_status: 丧偶
  social_circle: 几乎不出门;老邻居偶尔打照面

# === 心理学维度 ===
disc:
  dominance: 0.35          # 低:不主动、不麻烦人
  influence: 0.15          # 极低:不爱交流
  steadiness: 0.80         # 高:稳、慢、固执
  conscientiousness: 0.75  # 高:老派、讲规矩、要面子

big_five:
  openness: 0.40
  conscientiousness: 0.75
  extraversion: 0.15       # 极低
  agreeableness: 0.60      # 温和但嘴硬
  neuroticism: 0.55        # 有焦虑/低落,内化不外露

attachment_style: avoidant   # 回避型:亲近的人也不主动表达需求

