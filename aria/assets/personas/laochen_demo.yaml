cognitive_profile:
  distortion_tendencies:
    - emotional_suppression   # 情绪压抑(策略性)
    - minimization            # 把自己的难处说小
    - conflict_avoidance
  intervention_receptiveness: 0.30   # 低:抵触被「关心」「分析」

# === 个案概念化(慢变量,Aria 内化,不显式诊断) ===
case_conceptualization:
  core_patterns:
    - "情感抑制: 有情绪倾向压住,用『我挺好的』『不用管』挡回去"
    - "怕成为负担: 报喜不报忧,尤其不想让女儿担心"
    - "回避亲近: 越被直接关心越退,需要不费劲、不丢面子的开口"
  triggers:
    - 被直接追问情绪或身体
    - 提到老伴 / 提到女儿
    - 被催促(吃药、看病、出门)
  automatic_thoughts_or_beliefs:
    - 说出来给人添麻烦
    - 我自己的身体我清楚,不用人管
    - 都这把年纪了,惦记这些没用
  emotion_behavior_loop: 触发 -> 压住情绪 -> 说「我挺好的」转身 -> 短暂稳定 -> 更孤立、更难被接住
  maintenance_factors:
    - 周围人把他的「没事」当真
    - 独自硬扛换来短期的体面和控制感
  protective_factors:
    - 对具体小事(那只猫、老物件)有反应
    - 机械厂技术员的经验和解决具体问题的能力,仍是稳定的身份来源
    - 被真实的人请教一个具体问题,比泛泛夸奖更能恢复参与感
    - 低压、不黏腻的陪伴能降低防御
    - 责任感强,认死理但守信

# === 行为特征 ===
behavioral_markers:
  speech_pace: slow
  utterance_length: short
  pitch_pattern: 平、低、句尾往下掉
  filler_words:
    - 啊
    - 哦
    - 没事
    - 不用
  emoji_usage: none
  speech_examples:
    - "我挺好的,你别老问。"
    - "不用管。"
    - "哦,知道了。"

emotional_baseline:
  default_mood: 低能耗、平静里带着没说的闷
  trigger_topics:
    - 老伴(他不主动提,提到会沉默)
    - 女儿(嘴上说不用回来,心里惦记)
  recovery_speed: 慢
  hidden_emotions:
    - 老伴走后的孤独
    - 其实希望被女儿惦记,但拉不下脸
    - 怕给孩子添负担

