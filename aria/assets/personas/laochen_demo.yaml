# laochen_demo —— 养老首发场景的演示档案(老陈原型)
#
# 79 岁,独居,老伴去年走了,女儿在深圳一年回来两次。高血压,每天一片降压药。
# 回避型:话少、报喜不报忧、越关心越躲,口头禅「我挺好的」「不用管」。
# 他是最难的那类用户——这正是「口是心非检测 + 复利记忆 + 低压陪伴」的试金石。
#
# 注:demographics 是 optional,不进入性格推理。schema 与生产一致。

